# Builds the Windows installer on every push to main and publishes it as the
# GitHub Release for the version in package.json (v0.1.0, v0.2.0, …). To ship
# a new version, raise "version" in package.json and push.
name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meter

      - name: Build the DPS meter
        shell: bash
        run: |
          cargo build --release --manifest-path meter/Cargo.toml
          mkdir -p meter-dist
          cp meter/target/release/daeva-meter.exe meter-dist/
          cp -r meter/data meter-dist/data

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: DaevaHub-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Daeva Hub ${{ steps.version.outputs.version }}
          files: dist/*.exe
          overwrite_files: true
          generate_release_notes: true
